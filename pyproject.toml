[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rock-hard-harness"
version = "0.1.0"
description = "OpenSCAP harness that lets Claude enforce STIG compliance and triage CVEs."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["lxml>=4.9"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
rockhard = "rockhard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

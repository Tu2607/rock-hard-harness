name: test

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install OpenSCAP
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends openscap-scanner
      - run: pip install -e '.[test]'
      - run: pytest -v
